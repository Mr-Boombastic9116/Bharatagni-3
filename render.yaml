# ==============================================================================
# BharatAgri Iteration 3 - Render Deployment Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Option 1 (Recommended): Unified Full-Stack Web Service
  # Runs FastAPI backend, serves trained ML models, and delivers built React SPA
  # ----------------------------------------------------------------------------
  - type: web
    name: bharatagri-3
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
        # e.g., your external MySQL host (Aiven, TiDB Cloud, PlanetScale, AWS RDS)
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: bharatagri_iteration2
      - key: DATABASE_URL
        sync: false
        # Optional: Direct connection string (e.g., mysql+pymysql://user:pass@host:port/dbname)
      - key: DB_SSL_DISABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ALLOWED_ORIGINS
        value: "*"

